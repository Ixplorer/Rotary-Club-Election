<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD363"/>
      <stop offset="50%" stop-color="#F7A81B"/>
      <stop offset="100%" stop-color="#D48600"/>
    </linearGradient>
    <linearGradient id="blueLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00246C"/>
      <stop offset="100%" stop-color="#07193B"/>
    </linearGradient>
  </defs>

  <!-- Rotary Wheel on the Left -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- 24 Cogs -->
    <g fill="url(#goldLinear)">
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(0 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(15 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(30 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(45 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(60 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(75 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(90 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(105 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(120 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(135 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(150 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(165 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(180 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(195 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(210 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(225 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(240 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(255 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(270 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(285 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(300 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(315 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(330 100 100)" />
      <rect x="94" y="2" width="12" height="18" rx="2" transform="rotate(345 100 100)" />
    </g>
    <circle cx="100" cy="100" r="88" fill="url(#goldLinear)" />
    <circle cx="100" cy="100" r="76" fill="url(#blueLinear)" />
    <path id="upArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
    <path id="dnArc" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
    <text font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="url(#goldLinear)" letter-spacing="3.5">
      <textPath href="#upArc" startOffset="50%" text-anchor="middle">ROTARY</textPath>
    </text>
    <text font-family="'Arial Black', sans-serif" font-weight="900" font-size="10.5" fill="url(#goldLinear)" letter-spacing="1.5">
      <textPath href="#dnArc" startOffset="50%" text-anchor="middle">INTERNATIONAL</textPath>
    </text>
    <circle cx="100" cy="100" r="56" fill="url(#goldLinear)" />
    <circle cx="100" cy="100" r="50" fill="url(#blueLinear)" />
    <g fill="url(#goldLinear)">
      <rect x="95" y="50" width="10" height="40" transform="rotate(0 100 100)" />
      <rect x="95" y="50" width="10" height="40" transform="rotate(60 100 100)" />
      <rect x="95" y="50" width="10" height="40" transform="rotate(120 100 100)" />
      <rect x="95" y="50" width="10" height="40" transform="rotate(180 100 100)" />
      <rect x="95" y="50" width="10" height="40" transform="rotate(240 100 100)" />
      <rect x="95" y="50" width="10" height="40" transform="rotate(300 100 100)" />
    </g>
    <circle cx="100" cy="100" r="22" fill="url(#goldLinear)" />
    <circle cx="100" cy="100" r="14" fill="url(#blueLinear)" />
    <rect x="97" y="82" width="6" height="8" fill="url(#blueLinear)" />
  </g>

  <!-- Divider Line -->
  <line x1="125" y1="20" x2="125" y2="100" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Club Typography -->
  <g transform="translate(140, 15)">
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#00246C" letter-spacing="-0.5">
      Rotary Club of Asokoro
    </text>
    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="16" fill="#F7A81B" letter-spacing="1">
      DISTRICT 9125, NIGERIA
    </text>
    <g transform="translate(0, 72)">
      <!-- Motto / Tagline Badge -->
      <rect x="0" y="0" width="145" height="22" rx="11" fill="#EBF4FF"/>
      <text x="72.5" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#00246C" text-anchor="middle">
        THE PACE SETTER
      </text>
      <!-- Nigeria Flag Mini -->
      <g transform="translate(155, 3)">
        <rect x="0" y="0" width="8" height="16" fill="#008751" rx="1"/>
        <rect x="8" y="0" width="8" height="16" fill="#FFFFFF"/>
        <rect x="16" y="0" width="8" height="16" fill="#008751" rx="1"/>
      </g>
    </g>
  </g>
</svg>
